name: Safety Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: safety-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # CI-tested Xcode, the same as PR Checks (README > Requirements). Select Xcode fails when
  # no Xcode_26.x is installed instead of using another one.
  XCODE_MAJOR: '26'

jobs:
  safety-contract:
    name: Safety, CleanerCore and Adaptive gates
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          xcode_app=$(ls -d /Applications/Xcode_${XCODE_MAJOR}.*.app 2>/dev/null | sort -V | tail -1 || true)
          if [[ -z "$xcode_app" ]]; then
            echo "::error::Xcode ${XCODE_MAJOR}.x is not installed on this runner, and CI does not fall back to another version. Update XCODE_MAJOR or runs-on. Installed:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode_app"
          swift --version

      # One entry point, so contributors run exactly this job locally: safety contract (tests +
      # coverage), CleanerCore (tests + 80% coverage gate), CleanerCore source contract, Adaptive
      # Experience bridge and catalog, then every verifier self-test. Each step is a log group.
      - name: Verify safety, CleanerCore and Adaptive gates (scripts/verify-all.sh)
        run: bash scripts/verify-all.sh
